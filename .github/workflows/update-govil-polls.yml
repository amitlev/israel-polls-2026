name: Enrich polls from gov.il disclosures

# gov.il's Central Elections Committee publishes fewer filings than Wikipedia
# (46 for this cycle so far, vs 190+ baked polls), but they trickle in daily and
# the "מעבר לכותרות" tab is fed from nothing else, so a weekly run left that tab
# up to a week behind. The listing page is Cloudflare-protected, so discovery
# uses a real headless browser (see update-govil-polls.mjs).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      write:
        description: 'Commit changes (unchecked = review-only, prints proposed changes and exits)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-govil-polls
  cancel-in-progress: false

env:
  # Now 'true': scheduled runs commit. Held at 'false' pending a spot-check of
  # the parsed output against the source PDFs, this meant every scheduled run
  # since the pipeline was built printed its findings and wrote nothing — the
  # "מעבר לכותרות" tab sat frozen on the two filings from the original manual
  # run while gov.il published 44 more.
  #
  # That spot-check has since been done against Midgam's template — the only one
  # of the four that discloses topical questions — with filings 4/14/24/32
  # verified field-by-field against their PDFs. The other templates degrade to
  # nulls rather than wrong values (see the parsing-risk note in
  # .github/scripts/lib/govil-pdf-parser.mjs), and a filing whose pollster or
  # fieldwork date can't be read is skipped with a printed reason, never guessed.
  #
  # Set back to 'false' to return scheduled runs to review-only; a manual
  # workflow_dispatch run with "write" checked commits either way.
  GOVIL_AUTO_WRITE: 'true'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch & merge gov.il enrichment
        env:
          WRITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.write) && '1' || (github.event_name == 'schedule' && env.GOVIL_AUTO_WRITE == 'true') && '1' || '' }}
        run: node .github/scripts/update-govil-polls.mjs

      - name: Commit & push if data changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit (review-only run, or nothing new)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html \
                  plugins/israel-polls-2026/skills/israel-polls-dashboard/assets/dashboard.html \
                  .restore/
          git commit -m "data: enrich polls from gov.il disclosures [skip ci]"
          git push
