name: Update polls from Wikipedia

# Twice daily (10:00 and 22:00 UTC), plus manual runs from the Actions tab.
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # for the "unrecognized party column" alert below

# Avoid overlapping runs.
concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch & merge new polls from Wikipedia
        id: fetch
        run: node .github/scripts/update-polls.mjs

      - name: Commit & push if data changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new polls — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html \
                  plugins/israel-polls-2026/skills/israel-polls-dashboard/assets/dashboard.html \
                  .restore/
          git commit -m "data: auto-update polls from Wikipedia [skip ci]"
          git push

      # Catches exactly the class of gap that let "Unity"/"Amcha Yisrael" go
      # unnoticed: a new party column on Wikipedia's table that headerKey()
      # doesn't recognize yet gets silently dropped rather than shown. Runs
      # even when there were no new polls to commit (id: fetch above still
      # sets this output first). Opens one issue and comments on repeat
      # detections instead of spamming a new issue every run.
      - name: Report unrecognized party columns
        if: always() && steps.fetch.outputs.unrecognized_parties != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PARTIES: ${{ steps.fetch.outputs.unrecognized_parties }}
        run: |
          TITLE="New party column(s) on Wikipedia not yet recognized"
          BODY="The Wikipedia polling table now has a party column this dashboard doesn't recognize yet: **${PARTIES}**.

          Until \`headerKey()\`/\`ALL_KEYS\`/\`PARTIES\` are updated (in both \`.github/scripts/update-polls.mjs\` and \`docs/index.html\`, mirrored to the plugin's \`dashboard.html\`), this party's seats are silently dropped from every poll instead of shown — add the party there (see the Unity/Amcha Yisrael entries for the pattern) and add a PARTIES entry with a photo.

          Opened automatically by the twice-daily poll-update workflow. Close manually once fixed — will reopen (well, comment) if it recurs."
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still detected as of $(date -u +%Y-%m-%dT%H:%M:%SZ): **${PARTIES}**"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
